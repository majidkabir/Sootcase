openapi: 3.1.0
info:
  title: Sootcase API
  version: 0.1.0
  description: >
    Freight emissions calculator following the GLEC Framework / ISO 14083 approach.
    Emissions are in kg CO2e. TTW = tank-to-wheel, WTW = well-to-wheel.
  license:
    name: PolyForm Noncommercial 1.0.0
    identifier: PolyForm-Noncommercial-1.0.0
servers:
  - url: https://sootcase.org
    description: "Free test service; send your API key as 'Authorization: Bearer <key>' (get one at https://sootcase.org)"
  - url: http://localhost:8080
    description: sootcase serve
paths:
  /healthz:
    get:
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /v1/factors:
    get:
      summary: The loaded emission factor dataset
      responses:
        "200":
          description: Factor dataset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
  /v1/places:
    get:
      summary: Find cities, ports, rail and road terminals and airports by name or code
      parameters:
        - { name: q, in: query, required: true, schema: { type: string }, description: Name, UN/LOCODE or IATA code, e.g. rotterdam, NLRTM, CPH }
        - { name: kind, in: query, schema: { type: string }, description: "Comma-separated kinds: city, port, rail, road, airport, inland, border" }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 50 } }
      responses:
        "200":
          description: Matching places, best first
          content:
            application/json:
              schema:
                type: object
                properties:
                  places:
                    type: array
                    items: { $ref: "#/components/schemas/Place" }
  /v1/calculate:
    post:
      summary: Calculate emissions for one shipment
      parameters:
        - name: add_road_legs
          in: query
          schema: { type: boolean, default: true }
          description: false adds no road legs for shipments that don't set add_road_legs themselves.
        - name: explain
          in: query
          schema: { type: boolean, default: false }
          description: >
            Add "explanation": the calculation step by step (cargo mass, each leg's distance, transport
            activity, intensity and emissions, hubs, total), with the numbers used and the GLEC Framework
            v3.2 pages and ISO 14083:2023 clauses each step follows, so that it can be checked by hand.
        - name: path
          in: query
          schema: { type: boolean, default: false }
          description: Add each leg's route as GeoJSON [lon, lat] points (legs[].path), for a map. Two points mean a straight line (distance given or estimated).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Shipment" }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Result" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Busy", description: "Busy, or a routing service didn't answer (also when tried again): try again after Retry-After" }
        "504": { $ref: "#/components/responses/Error" }
  /v1/calculate/batch:
    post:
      summary: Calculate emissions for up to 10,000 shipments
      description: Failures are reported per shipment; the request itself still returns 200.
      parameters:
        - name: add_road_legs
          in: query
          schema: { type: boolean, default: true }
          description: false adds no road legs for shipments that don't set add_road_legs themselves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipments]
              properties:
                shipments:
                  type: array
                  items: { $ref: "#/components/schemas/Shipment" }
      responses:
        "200":
          description: Per-shipment results
          content:
            application/json:
              schema:
                type: object
                properties:
                  failed: { type: integer }
                  retryable: { type: integer, description: Failures worth sending again }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        shipment_id: { type: string }
                        result: { $ref: "#/components/schemas/Result" }
                        error: { type: string }
                        retryable: { type: boolean, description: "The failure isn't the input's fault (a routing service didn't answer, also when tried again): send it again" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Busy" }
        "504": { $ref: "#/components/responses/Error" }
  /v1/report:
    post:
      summary: ISO 14083 style report over up to 10,000 shipments
      description: >
        Calculates the shipments and aggregates them: totals split into
        operational (TTW) and energy provision (WTT) emissions, per mode, per
        hub type and per energy carrier, data quality, DAFs, and notes on
        omissions. Failed shipments are excluded and listed.
      parameters:
        - name: add_road_legs
          in: query
          schema: { type: boolean, default: true }
          description: false adds no road legs for shipments that don't set add_road_legs themselves.
        - name: format
          in: query
          schema: { type: string, enum: [json, md] }
          description: md returns Markdown
        - name: results
          in: query
          schema: { type: boolean, default: false }
          description: Also return each shipment's full result (results[], as in a batch, in input order)
        - name: markdown
          in: query
          schema: { type: boolean, default: false }
          description: Also return the report as Markdown (markdown), alongside the JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipments]
              properties:
                title: { type: string, maxLength: 1000 }
                organisation: { type: string, maxLength: 1000 }
                period_from: { type: string, format: date }
                period_to: { type: string, format: date }
                reference: { type: string, maxLength: 1000, description: Where supporting information can be found }
                declare_iso:
                  type: boolean
                  description: Add the ISO 14083:2023 conformity statement. Only the reporter can make this claim.
                shipments:
                  type: array
                  items: { $ref: "#/components/schemas/Shipment" }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
            text/markdown:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Busy" }
        "504": { $ref: "#/components/responses/Error" }
  /v1/scenario:
    post:
      summary: What-if comparison of up to 2,500 shipments
      description: >
        Calculates the shipments as they are and with the plan's changes
        (road_to_rail, electrify, fuel_switch, load), with the same method,
        and returns both totals, the difference, and per change what it
        affected and the sources of its values. Defaults for road_to_rail:
        legs over 300 km, 30% of the cargo (EU Transport White Paper 2011),
        rail part over 100 km in a straight line (Directive 92/106/EEC).
        Results are scenarios, not reported emissions. Send JSON, or a
        shipments CSV (text/csv) with the plan as JSON in the plan query
        parameter.
      parameters:
        - name: plan
          in: query
          schema: { type: string }
          description: With a text/csv body, the plan as JSON.
        - name: add_road_legs
          in: query
          schema: { type: boolean, default: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, shipments]
              properties:
                plan: { $ref: "#/components/schemas/ScenarioPlan" }
                shipments:
                  type: array
                  items: { $ref: "#/components/schemas/Shipment" }
          text/csv:
            schema: { type: string }
      responses:
        "200":
          description: Comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioResult" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Busy" }
        "504": { $ref: "#/components/responses/Error" }
  /v1/recommend:
    post:
      summary: Route changes that lower emissions, for up to 1,000 shipments
      description: >
        For each shipment, calculates alternatives with the same method:
        road legs to rail, inland waterway or short sea; air legs to sea or
        rail; other sea ports; fuller loads (when a load is given). Lists
        those lower than now, best first, with totals per kind and per lane,
        the sources of the rules, and what isn't taken into account
        (limitations). Defaults: road legs over 300 km (EU Transport White
        Paper 2011); rail, waterway or sea part over 100 km in a straight
        line, road to a waterway or sea port within 150 km of it, road to
        the nearest rail terminal (Directive 92/106/EEC, Art. 1). Results are
        scenarios, not reported emissions. Send JSON, or a shipments CSV
        (text/csv) with the settings as JSON in the settings query parameter.
      parameters:
        - name: settings
          in: query
          schema: { type: string }
          description: With a text/csv body, the settings as JSON (optional).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipments]
              properties:
                settings: { $ref: "#/components/schemas/RecommendSettings" }
                shipments:
                  type: array
                  items: { $ref: "#/components/schemas/Shipment" }
          text/csv:
            schema: { type: string }
      responses:
        "200":
          description: Alternatives
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendResult" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Busy" }
        "504": { $ref: "#/components/responses/Error" }
components:
  responses:
    Busy:
      description: Too many requests in progress; retry after the given seconds
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
  schemas:
    DistanceType:
      type: string
      enum: [sfd, gcd, actual]
      description: "Shortest feasible, great-circle, or actually travelled distance (GLEC / ISO 14083)"
    DataType:
      type: string
      enum: [primary, modelled, default]
      description: "primary: measured fuel; modelled: load or energy model from shipment inputs; default: published factor"
    Mode:
      type: string
      enum: [road, rail, sea, air, inland_waterway]
    Location:
      type: object
      description: Coordinates, or a code instead of them.
      properties:
        name: { type: string }
        code:
          type: string
          description: UN/LOCODE (NLRTM) or IATA airport code (CPH), used when lat and lon are not given. Find codes with GET /v1/places.
          example: NLRTM
        lat: { type: number }
        lon: { type: number }
    Place:
      type: object
      properties:
        id: { type: string, example: "locode:NLRTM" }
        code: { type: string, example: NLRTM }
        kinds:
          type: array
          items: { type: string, enum: [city, port, rail, road, airport, inland, border] }
        name: { type: string, example: Rotterdam }
        alt_name: { type: string, description: e.g. the English name of a place listed under its local name }
        region: { type: string }
        country: { type: string, example: NL }
        country_name: { type: string, example: Netherlands }
        lat: { type: number }
        lon: { type: number }
    FuelUse:
      type: object
      required: [fuel, amount]
      properties:
        fuel: { type: string, example: diesel }
        amount: { type: number, description: In the fuel factor's unit }
        vehicle_tonne_km:
          type: number
          description: Total tonne-km on the vehicle trip, for allocation. 0 or absent = whole trip.
    Leg:
      type: object
      required: [mode]
      properties:
        id: { type: string }
        mode: { $ref: "#/components/schemas/Mode" }
        vehicle_type:
          type: string
          example: hgv
          description: Must exist in the loaded dataset; list them with GET /v1/factors
        from: { $ref: "#/components/schemas/Location" }
        to: { $ref: "#/components/schemas/Location" }
        distance_km:
          type: number
          description: Overrides computed distance when > 0
        distance_type:
          $ref: "#/components/schemas/DistanceType"
        fuel: { $ref: "#/components/schemas/FuelUse" }
        load_factor:
          type: number
          exclusiveMinimum: 0
          maximum: 1
          description: >
            Load as a share of the load model's payload (DESNZ's average full
            load, e.g. 17.9 t for an artic over 33 t), not of the truck's rated
            payload; switches the leg to the dataset's load model. Give this or load_tonnes.
            In GLEC and EcoTransIT a load factor is a share of the rated payload, so the
            same value means more tonnes there: to compare, or when the weight is known,
            give load_tonnes.
        load_tonnes:
          type: number
          exclusiveMinimum: 0
          description: >
            Tonnes on the truck (all cargo, average over the loaded km); switches
            the leg to the load model. Up to 1.6 × the model's payload: above
            its payload the model is extended linearly.
        empty_trip_factor:
          type: number
          minimum: 0
          description: Empty km per loaded km (needs load_factor or load_tonnes)
        energy_kwh_per_tkm:
          type: number
          exclusiveMinimum: 0
          description: Electricity per tonne-km; with country, switches the leg to the energy method
        country:
          type: string
          description: ISO 3166-1 alpha-3 country whose grid powers the leg, e.g. DNK
    HubStop:
      type: object
      required: [hub_type]
      properties:
        id: { type: string }
        hub_type: { type: string, example: container_terminal }
    Shipment:
      type: object
      required: [legs]
      description: Give weight_kg, or teu with teu_net_tonnes or container_load; teu alone uses the dataset's "average" profile (GLEC, 10 t per TEU).
      properties:
        id: { type: string }
        weight_kg: { type: number, exclusiveMinimum: 0 }
        teu: { type: number, exclusiveMinimum: 0 }
        teu_net_tonnes: { type: number, description: Net cargo tonnes per TEU }
        container_load: { type: string, description: "Profile name from the dataset's container_loads" }
        legs:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Leg" }
        hubs:
          type: array
          items: { $ref: "#/components/schemas/HubStop" }
        add_road_legs:
          type: boolean
          default: true
          description: >
            Add road legs where the trip doesn't join up: across a gap of more
            than 5 km between one leg's end and the next leg's start, and to
            or from a port or rail terminal when a sea, rail or inland
            waterway leg starts or ends off its network (the leg is moved
            there). Added and moved legs are marked in the result. When
            false, gaps and inland sea ends are only warnings.
    Factor:
      type: object
      properties:
        mode: { $ref: "#/components/schemas/Mode" }
        vehicle_type: { type: string }
        ttw_g_per_tkm: { type: number }
        wtt_g_per_tkm: { type: number }
        source: { type: string }
        year: { type: integer }
        distance_basis: { $ref: "#/components/schemas/DistanceType" }
    FuelFactor:
      type: object
      properties:
        fuel: { type: string }
        biogenic_co2_kg_per_unit: { type: number, description: "Biogenic CO2 per unit, outside the TTW/WTT factors" }
        unit: { type: string }
        ttw_kg_per_unit: { type: number }
        wtt_kg_per_unit: { type: number }
        source: { type: string }
        year: { type: integer }
    HubFactor:
      type: object
      properties:
        hub_type: { type: string }
        wtw_g_per_tonne: { type: number }
        source: { type: string }
        year: { type: integer }
    LegResult:
      type: object
      properties:
        leg_id: { type: string, description: "The leg's id, or added-N for an added road leg" }
        biogenic_co2_kg: { type: number, description: "Biogenic CO2, reported separately and not included in the totals (GLEC v3.2 p. 64)" }
        added:
          type: string
          enum: [gap, access]
          description: "Set on road legs the calculator added: gap (the legs didn't join up) or access (to or from the port or terminal a leg was moved to)"
        note: { type: string, description: Why the leg was added, or where its end was moved to }
        factor_note: { type: string, description: Which factor the vehicle type meant at this leg's distance (e.g. container_ship short-sea or deep-sea) }
        from: { $ref: "#/components/schemas/Location", description: "Where the leg was calculated from (moved for a leg moved to a port or terminal), when known" }
        to: { $ref: "#/components/schemas/Location", description: Where the leg was calculated to, when known }
        mode: { $ref: "#/components/schemas/Mode" }
        vehicle_type: { type: string }
        distance_km: { type: number }
        distance_method:
          type: string
          description: Where the distance came from
          enum: [given, great_circle, great_circle_adjusted, osrm, osrm_rail, osrm_waterway, sea_network]
        distance_type: { $ref: "#/components/schemas/DistanceType" }
        daf:
          type: number
          description: Distance adjustment factor applied to emissions, when the leg's distance type differed from the factor's basis
        daf_source: { type: string }
        tonne_km: { type: number }
        ttw_kg: { type: number }
        wtt_kg: { type: number }
        wtw_kg: { type: number }
        intensity_g_per_tkm: { type: number, description: WTW g CO2e per tonne-km for this leg }
        method: { type: string, enum: [intensity, fuel, load_model, energy] }
        data_type: { $ref: "#/components/schemas/DataType" }
        energy_kwh_per_tkm: { type: number }
        country: { type: string }
        load_factor: { type: number, description: "Load as a share of payload_t (from load_tonnes when that was given)" }
        load_tonnes: { type: number }
        empty_trip_factor: { type: number }
        payload_t: { type: number }
        factor: { $ref: "#/components/schemas/Factor" }
        fuel_factor: { $ref: "#/components/schemas/FuelFactor" }
        allocation_share: { type: number }
        route_parts_km:
          type: object
          additionalProperties: { type: number }
          description: "Routed km by kind: ferry (road), electrified, not_electrified, electrification_unknown (rail)"
        path:
          type: array
          description: With ?path=true only. The leg's route as GeoJSON [lon, lat] points; two points mean a straight line.
          items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        parts:
          type: array
          description: Parts calculated separately and included in the leg's totals
          items: { $ref: "#/components/schemas/LegPart" }
    LegPart:
      type: object
      properties:
        kind: { type: string, enum: [ferry, electrified] }
        mode: { $ref: "#/components/schemas/Mode" }
        distance_km: { type: number }
        tonne_km: { type: number }
        ttw_kg: { type: number }
        wtt_kg: { type: number }
        wtw_kg: { type: number }
        method: { type: string }
        data_type: { $ref: "#/components/schemas/DataType" }
        factor: { $ref: "#/components/schemas/Factor" }
        daf: { type: number }
        daf_source: { type: string }
        energy_kwh_per_tkm: { type: number }
        country: { type: string }
    Result:
      type: object
      properties:
        shipment_id: { type: string }
        biogenic_co2_kg: { type: number, description: "Biogenic CO2, reported separately and not included in the totals (GLEC v3.2 p. 64)" }
        weight_kg: { type: number, description: Cargo weight used }
        weight_basis: { type: string, enum: [weight, teu] }
        container_load: { type: string, description: Container load profile that set the tonnes per TEU }
        legs:
          type: array
          items: { $ref: "#/components/schemas/LegResult" }
        hubs:
          type: array
          items:
            type: object
            properties:
              hub_id: { type: string }
              hub_type: { type: string }
              wtw_kg: { type: number }
              data_type: { $ref: "#/components/schemas/DataType" }
              source: { type: string }
        tonne_km: { type: number }
        ttw_kg: { type: number }
        wtw_kg: { type: number, description: Transport plus hubs }
        intensity_g_per_tkm: { type: number, description: Transport WTW only }
        wtt_kg: { type: number, description: Transport well-to-tank (hubs are WTW only) }
        primary_data_share: { type: number, description: Share of WTW emissions from primary data (0-1) }
        dataset: { type: string }
        warnings:
          type: array
          items: { type: string }
          description: Things left as given that may make the result too low, e.g. a gap between legs not counted
    Dataset:
      type: object
      properties:
        name: { type: string }
        note: { type: string }
        legs:
          type: array
          items: { $ref: "#/components/schemas/Factor" }
        hubs:
          type: array
          items: { $ref: "#/components/schemas/HubFactor" }
        fuels:
          type: array
          items: { $ref: "#/components/schemas/FuelFactor" }
        grids:
          type: array
          description: Electricity carbon intensity per country
          items:
            type: object
            properties:
              country: { type: string }
              year: { type: integer }
              g_per_kwh: { type: number }
              source: { type: string }
        grid_note: { type: string }
        container_loads:
          type: object
          additionalProperties: { type: number }
          description: Profile name to net cargo tonnes per TEU
        dafs:
          type: array
          description: "Distance adjustment factors: to_km = from_km * multiplier + add_km"
          items:
            type: object
            properties:
              mode: { $ref: "#/components/schemas/Mode" }
              from: { $ref: "#/components/schemas/DistanceType" }
              to: { $ref: "#/components/schemas/DistanceType" }
              multiplier: { type: number }
              add_km: { type: number }
              source: { type: string }
        distance_adjustments:
          type: array
          description: "Great-circle to actual distance, per mode: gcd * multiplier + add_km"
          items:
            type: object
            properties:
              mode: { $ref: "#/components/schemas/Mode" }
              multiplier: { type: number }
              add_km: { type: number }
              source: { type: string }
    Report:
      type: object
      description: See pkg/report for every field. Emissions in kg CO2e.
      properties:
        title: { type: string }
        organisation: { type: string }
        period: { type: object, properties: { from: { type: string }, to: { type: string } } }
        level: { type: string, example: transport_or_hub_services }
        statement: { type: string }
        reference: { type: string }
        datasets: { type: array, items: { type: string } }
        generated: { type: string, format: date-time }
        coverage:
          type: object
          properties:
            shipments: { type: integer }
            calculated: { type: integer }
            failed: { type: integer }
            failed_ids: { type: array, items: { type: string }, description: First 100 }
            retryable_failed: { type: integer, description: "Failures that weren't the data's fault (a routing service didn't answer, also when tried again): calculate them again" }
            legs: { type: integer }
            hub_stops: { type: integer }
            weight_t: { type: number }
            added_road_legs: { type: integer, description: Road legs added by the calculator, included in legs and totals }
            added_road_km: { type: number }
            added_road_leg_shipments: { type: integer }
            warned_shipments: { type: integer }
            warnings:
              type: array
              description: Warnings by kind
              items: { type: object, properties: { reason: { type: string }, shipments: { type: integer } } }
        total:
          type: object
          properties:
            wtw_kg: { type: number }
            transport_wtw_kg: { type: number }
            ttw_kg: { type: number, description: Operational emissions, transport }
            wtt_kg: { type: number, description: Energy provision emissions, transport }
            hub_wtw_kg: { type: number }
            tonne_km: { type: number }
            intensity_g_per_tkm: { type: number }
            distance_types:
              type: object
              additionalProperties: { type: number }
              description: Share of tonne-km per distance type (sfd, gcd, actual, unspecified)
        modes: { type: array, items: { type: object } }
        hubs: { type: array, items: { type: object } }
        energy_carriers: { type: array, items: { type: object } }
        data_quality: { type: object }
        distance_adjustments: { type: array, items: { type: object } }
        notes: { type: array, items: { type: string } }
    RecommendSettings:
      type: object
      properties:
        kinds:
          type: array
          items: { type: string, enum: [road_to_rail, road_to_waterway, road_to_short_sea, air_to_sea, air_to_rail, other_port, fuller_loads] }
          description: Kinds to try; empty means all (fuller_loads only with a load)
        min_road_km: { type: number, description: "Road legs longer than this are tried on rail, waterway and short sea (default 300)" }
        min_main_km: { type: number, description: "The rail, waterway or sea part must be longer than this in a straight line (default 100)" }
        max_port_road_km: { type: number, description: "Road to and from a waterway or sea port within this of it in a straight line (default 150)" }
        terminal: { type: string, enum: [nearest, best_trip] }
        rail_vehicle: { type: string, description: default freight_train }
        waterway_vehicle: { type: string, description: default container_barge }
        short_sea_vehicle: { type: string, description: default roro }
        sea_vehicle: { type: string, description: "default container_ship (air to sea)" }
        port_radius_km: { type: number, description: "Other ports within this of the port used now (default 800)" }
        max_ports: { type: integer, description: "Other ports to try per port (default 4)" }
        load_tonnes: { type: number }
        load_factor: { type: number }
        empty_trip_factor: { type: number }
        load_vehicle: { type: string }
        source: { type: string, description: Where the load values come from }
    RecommendRoute:
      type: object
      properties:
        ttw_kg: { type: number }
        wtt_kg: { type: number }
        wtw_kg: { type: number }
        biogenic_co2_kg: { type: number }
        distance_km: { type: number }
        transfers: { type: integer, description: Changes of mode along the route }
        modes: { type: array, items: { type: string } }
        steps: { type: array, items: { type: object } }
    RecommendResult:
      type: object
      properties:
        label: { type: string }
        settings: { $ref: "#/components/schemas/RecommendSettings" }
        skipped: { type: object, additionalProperties: { type: string } }
        now: { $ref: "#/components/schemas/ScenarioTotals" }
        best: { $ref: "#/components/schemas/ScenarioTotals" }
        saved_kg: { type: number }
        saved_pct: { type: number }
        kinds: { type: array, items: { type: object } }
        lanes: { type: array, items: { type: object } }
        sources: { type: array, items: { type: string } }
        limitations: { type: array, items: { type: string } }
        failed: { type: integer }
        shipments:
          type: array
          items:
            type: object
            properties:
              shipment_id: { type: string }
              lane: { type: string }
              weight_kg: { type: number }
              now: { $ref: "#/components/schemas/RecommendRoute" }
              legs: { type: array, items: { type: object }, description: The shipment's own legs }
              options:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/RecommendRoute"
                    - type: object
                      properties:
                        kind: { type: string }
                        summary: { type: string }
                        saved_kg: { type: number }
                        saved_pct: { type: number }
                        extra_km_pct: { type: number }
                        legs: { type: array, items: { type: object } }
              notes: { type: array, items: { type: string } }
              error: { type: string }
    ScenarioChange:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [road_to_rail, electrify, fuel_switch, load] }
        vehicle_types: { type: array, items: { type: string }, description: Road vehicle types the change applies to; empty means all road legs }
        share: { type: number, exclusiveMinimum: 0, maximum: 1, description: "Share of the cargo on each matching leg (default 0.3 for road_to_rail, else 1)" }
        source: { type: string, description: Where the given values come from (required for electrify, and for energy_ratio other than 1) }
        min_road_km: { type: number, description: "road_to_rail: road legs longer than this (default 300)" }
        min_rail_km: { type: number, description: "road_to_rail: rail part longer than this in a straight line (default 100)" }
        rail_vehicle: { type: string, description: "road_to_rail: default freight_train" }
        terminal: { type: string, enum: [nearest, best_trip], description: "road_to_rail: nearest rail terminal reachable by road (default, Directive 92/106/EEC), or the best trip among the nearest" }
        kwh_per_tkm: { type: number, description: "electrify: kWh per tonne-km" }
        country: { type: string, description: "electrify: ISO 3166 alpha-3 for the grid factor" }
        fuel: { type: string, description: "fuel_switch: hvo, b100, biodiesel, biomethane, biomethane_lng, cng, lng, or a dataset fuel id" }
        energy_ratio: { type: number, description: "fuel_switch: energy per tonne-km relative to the diesel vehicle (default 1)" }
        load_tonnes: { type: number }
        load_factor: { type: number }
        empty_trip_factor: { type: number }
    ScenarioPlan:
      type: object
      required: [changes]
      properties:
        name: { type: string }
        changes: { type: array, items: { $ref: "#/components/schemas/ScenarioChange" } }
    ScenarioTotals:
      type: object
      properties:
        ttw_kg: { type: number }
        biogenic_co2_kg: { type: number, description: "Biogenic CO2, reported separately and not included in the totals (GLEC v3.2 p. 64)" }
        wtt_kg: { type: number }
        wtw_kg: { type: number }
    ScenarioResult:
      type: object
      properties:
        plan: { type: string }
        label: { type: string }
        base: { $ref: "#/components/schemas/ScenarioTotals" }
        scenario: { $ref: "#/components/schemas/ScenarioTotals" }
        diff_kg: { type: number, description: Scenario minus base, WTW }
        diff_pct: { type: number }
        failed: { type: integer }
        changes:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/ScenarioChange"
              - type: object
                properties:
                  shipments_affected: { type: integer }
                  legs_affected: { type: integer }
                  sources: { type: array, items: { type: string } }
        shipments:
          type: array
          items:
            type: object
            properties:
              shipment_id: { type: string }
              base: { $ref: "#/components/schemas/ScenarioTotals" }
              scenario: { $ref: "#/components/schemas/ScenarioTotals" }
              diff_kg: { type: number }
              notes: { type: array, items: { type: string } }
              error: { type: string }
