name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt'ed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: go test -race ./...

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - pkg/calc FuzzCalculate_Monotonic
          - pkg/calc FuzzCalculate_Finite
          - pkg/csvio FuzzReaders
          - pkg/ndjson FuzzReader
          - pkg/factors FuzzParse
          - pkg/toc FuzzParseBuild
          - pkg/distance FuzzSeaNetwork
          - internal/xlsx FuzzRows
          - internal/xlsx FuzzOpen
          - internal/desnz FuzzParse
          - internal/grid FuzzParseOWID
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fuzz 30s
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -- $TARGET
          go test "./$1" -run '^$' -fuzz "^$2\$" -fuzztime 30s -fuzzminimizetime 5s
      - name: Upload failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crasher-${{ strategy.job-index }}
          path: "**/testdata/fuzz/**"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sootcase:ci .
      - name: Smoke test
        run: |
          docker run -d --name sootcase -p 8080:8080 sootcase:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 0.5; done
          curl -fs -X POST localhost:8080/v1/calculate --data @examples/cph-rotterdam.json
          docker rm -f sootcase
      - name: Licence and notices in the image
        run: |
          docker create --name files sootcase:ci
          docker cp files:/usr/share/doc/sootcase/ ./imagedoc
          docker rm files
          cmp imagedoc/LICENSE LICENSE
          cmp imagedoc/NOTICE NOTICE
