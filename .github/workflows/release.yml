name: Release

# Three ways to release:
#   1. From GitHub: Actions > Release > Run workflow, enter a version like v0.1.0.
#      The workflow tests, creates the tag on the chosen branch, then builds.
#   2. From a terminal: git tag v0.1.0 && git push origin v0.1.0
#   3. Write the version (like v0.1.0) into the RELEASE file and push it to main:
#      same as 1, for setups that can push commits but not tags.
# Tags created by this workflow don't re-trigger it (GitHub doesn't start
# workflows from GITHUB_TOKEN pushes), so each release builds once.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [RELEASE]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        if: github.ref_type == 'branch'
        with:
          fetch-depth: 0
      - id: v
        name: Resolve version
        env:
          INPUT: ${{ inputs.version }}
          REF: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then v="$INPUT"
          elif [ "$REF_TYPE" = "branch" ]; then v="$(tr -d ' \r\n' < RELEASE)"
          else v="$REF"; fi
          if ! printf '%s' "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version '$v' must look like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        if: github.ref_type == 'branch'
        with:
          go-version-file: go.mod
      - name: Test before tagging
        if: github.ref_type == 'branch'
        run: go vet ./... && go test ./...
      - name: Create and push tag
        if: github.ref_type == 'branch'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Sootcase $VERSION"
          git push origin "refs/tags/$VERSION"

  binaries:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.tag.outputs.version }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.tag.outputs.version }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.tag.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/sootcase:${{ needs.tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/sootcase:latest
