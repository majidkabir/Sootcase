name: Compose

# Brings up the full stack (OSRM + sea network + Sootcase) on a tiny
# region and checks that road and sea legs are really routed; and the
# waterway add-on on a small region with a navigable river.
on:
  push:
    branches: [main]
    paths:
      - compose.yaml
      - compose.waterway.yaml
      - compose.rail.yaml
      - deploy/**
      - Dockerfile
      - cmd/**
      - pkg/distance/**
      - .github/workflows/compose.yml
  pull_request:
    paths:
      - compose.yaml
      - compose.waterway.yaml
      - compose.rail.yaml
      - deploy/**
      - Dockerfile
  schedule:
    - cron: "17 4 * * 1" # weekly, to catch upstream image or data changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OSRM_PBF_URL: https://download.geofabrik.de/europe/monaco-latest.osm.pbf
      SEA_RESOLUTION_KM: "100"
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for Sootcase
        run: |
          for i in $(seq 1 60); do
            if curl -fs localhost:8080/healthz; then exit 0; fi
            sleep 5
          done
          echo "Sootcase did not become healthy"; exit 1

      - name: Road leg is routed by OSRM
        run: |
          # Monte Carlo casino to Stade Louis II: about 1.7 km as the crow flies.
          out=$(curl -fsS -X POST localhost:8080/v1/calculate -d '{"weight_kg":1000,"legs":[{"mode":"road","vehicle_type":"hgv",
            "from":{"lat":43.7396,"lon":7.4277},"to":{"lat":43.7275,"lon":7.4155}}]}')
          echo "$out" | jq '.legs[0] | {distance_km, distance_method}'
          echo "$out" | jq -e '.legs[0].distance_method == "osrm" and .legs[0].distance_km > 1.5 and .legs[0].distance_km < 10'

      - name: Road leg from outside the map is refused
        run: |
          # Paris isn't on Monaco's map: OSRM would take it to the nearest road it has.
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST localhost:8080/v1/calculate -d '{"weight_kg":1000,"legs":[{"mode":"road","vehicle_type":"hgv",
            "from":{"lat":48.8566,"lon":2.3522},"to":{"lat":43.7275,"lon":7.4155}}]}')
          cat /tmp/out.json; echo
          [ "$code" = 422 ] && jq -e '.error | test("from the road network")' /tmp/out.json

      - name: Sea leg is routed on the maritime network
        run: |
          out=$(curl -fsS -X POST localhost:8080/v1/calculate -d '{"weight_kg":10000,"legs":[{"mode":"sea","vehicle_type":"container_ship",
            "from":{"lat":51.95,"lon":4.05},"to":{"lat":31.23,"lon":121.9}}]}')
          echo "$out" | jq '.legs[0] | {distance_km, distance_method}'
          # Rotterdam-Shanghai via Suez is about 19,700 km (great-circle would be about 9,000).
          echo "$out" | jq -e '.legs[0].distance_method == "sea_network" and .legs[0].distance_km > 18000 and .legs[0].distance_km < 21500'

      - name: Restart reuses prepared data
        run: |
          docker compose up -d
          for s in download-map prepare-osrm prepare-sea; do
            docker compose logs "$s" | grep -q "up to date" || { echo "$s redid its work"; exit 1; }
          done

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v

  waterway-rail:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The Saar is a class Vb federal waterway through Saarland.
      OSRM_PBF_URL: https://download.geofabrik.de/europe/germany/saarland-latest.osm.pbf
      SEA_RESOLUTION_KM: "100"
      COMPOSE_FILE: compose.yaml:compose.waterway.yaml:compose.rail.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Start stack with waterway and rail routing
        run: docker compose up -d --build

      - name: Wait for Sootcase
        run: |
          for i in $(seq 1 90); do
            if curl -fs localhost:8080/healthz; then exit 0; fi
            sleep 5
          done
          echo "Sootcase did not become healthy"; exit 1

      - name: Barge leg is routed along the Saar
        run: |
          # Saarbruecken to Dillingen: about 24 km as the crow flies, more along the river.
          out=$(curl -fsS -X POST localhost:8080/v1/calculate -d '{"weight_kg":1000000,"legs":[{"mode":"inland_waterway","vehicle_type":"barge",
            "from":{"lat":49.2328,"lon":6.9935},"to":{"lat":49.3537,"lon":6.7155}}]}')
          echo "$out" | jq '.legs[0] | {distance_km, distance_method, distance_type, daf, wtw_kg}'
          echo "$out" | jq -e '.legs[0].distance_method == "osrm_waterway" and .legs[0].distance_type == "sfd"
            and .legs[0].distance_km > 26 and .legs[0].distance_km < 45'
          echo "barge Saarbruecken-Dillingen: $(echo "$out" | jq '.legs[0].distance_km') km" >> "$GITHUB_STEP_SUMMARY"

      - name: Rail leg is routed on the railway
        run: |
          # Saarbruecken Hbf to Saarlouis Hbf: about 20 km as the crow flies, more by rail via Voelklingen.
          out=$(curl -fsS -X POST localhost:8080/v1/calculate -d '{"weight_kg":1000000,"legs":[{"mode":"rail","vehicle_type":"freight_train",
            "from":{"lat":49.2410,"lon":6.9910},"to":{"lat":49.3260,"lon":6.7450}}]}')
          echo "$out" | jq '.legs[0] | {distance_km, distance_method, distance_type, wtw_kg}'
          echo "$out" | jq -e '.legs[0].distance_method == "osrm_rail" and .legs[0].distance_type == "sfd"
            and .legs[0].distance_km > 20.5 and .legs[0].distance_km < 35'
          echo "rail Saarbruecken-Saarlouis: $(echo "$out" | jq '.legs[0].distance_km') km" >> "$GITHUB_STEP_SUMMARY"

      - name: Rail route reports electrification
        run: |
          # The Saarbruecken-Saarlouis line is electrified.
          out=$(curl -fsS -X POST localhost:8080/v1/calculate -d '{"weight_kg":1000000,"legs":[{"mode":"rail","vehicle_type":"freight_train",
            "energy_kwh_per_tkm":0.02,"country":"DEU","from":{"lat":49.2410,"lon":6.9910},"to":{"lat":49.3260,"lon":6.7450}}]}')
          echo "$out" | jq '.legs[0] | {distance_km, route_parts_km, method, parts}'
          echo "$out" | jq -e '.legs[0].route_parts_km.electrified > 15'
          echo "rail electrification: $(echo "$out" | jq -c '.legs[0].route_parts_km')" >> "$GITHUB_STEP_SUMMARY"

      - name: Points far from a waterway are refused without road legs
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST 'localhost:8080/v1/calculate?add_road_legs=false' -d '{"weight_kg":1000,"legs":[{"mode":"inland_waterway","vehicle_type":"barge",
            "from":{"lat":49.2328,"lon":6.9935},"to":{"lat":49.50,"lon":7.10}}]}')
          cat /tmp/out.json
          [ "$code" = 422 ] && grep -q "destination is .* km from the waterway network" /tmp/out.json

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v

  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Suduroy has no road link: Torshavn-Tvoroyri needs the Smyril ferry.
      OSRM_PBF_URL: https://download.geofabrik.de/europe/faroe-islands-latest.osm.pbf
      SEA_RESOLUTION_KM: "100"
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for Sootcase
        run: |
          for i in $(seq 1 60); do
            if curl -fs localhost:8080/healthz; then exit 0; fi
            sleep 5
          done
          echo "Sootcase did not become healthy"; exit 1

      - name: Ferry crossing on a road route is calculated as sea
        run: |
          out=$(curl -fsS -X POST localhost:8080/v1/calculate -d '{"weight_kg":10000,"legs":[{"mode":"road","vehicle_type":"hgv",
            "from":{"lat":62.0110,"lon":-6.7710},"to":{"lat":61.5560,"lon":-6.8100}}]}')
          echo "$out" | jq '.legs[0] | {distance_km, route_parts_km, parts: [.parts[] | {kind, mode, distance_km, wtw_kg}], wtw_kg}'
          echo "$out" | jq -e '.legs[0].parts[0].kind == "ferry" and .legs[0].parts[0].mode == "sea"
            and .legs[0].parts[0].distance_km > 40 and .legs[0].parts[0].distance_km < .legs[0].distance_km'
          echo "Torshavn-Tvoroyri: $(echo "$out" | jq -c '{km: .legs[0].distance_km, parts: .legs[0].route_parts_km}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
